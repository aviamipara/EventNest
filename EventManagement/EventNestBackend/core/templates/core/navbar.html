<style>
    /* Forceful Button Overrides for Consistency */
    .btn-outline-ocean {
        border: 2px solid #E11D48 !important;
        color: #E11D48 !important;
        background: transparent !important;
        text-transform: uppercase !important;
        font-family: 'Outfit', sans-serif !important;
        font-size: 0.9rem !important;
        letter-spacing: 1px !important;
        font-weight: 600 !important;
        padding: 10px 24px !important;
        border-radius: 50px !important;
        transition: all 0.3s ease !important;
        display: inline-flex !important;
        align-items: center !important;
        justify-content: center !important;
    }

    .btn-outline-ocean:hover {
        background-color: #E11D48 !important;
        color: #ffffff !important;
        transform: translateY(-2px) !important;
        box-shadow: 0 4px 12px rgba(225, 29, 72, 0.3) !important;
    }

    .btn-ocean {
        background: linear-gradient(135deg, #E11D48, #BE123C) !important;
        color: #ffffff !important;
        border: none !important;
        text-transform: uppercase !important;
        font-family: 'Outfit', sans-serif !important;
        font-size: 0.9rem !important;
        letter-spacing: 1px !important;
        font-weight: 600 !important;
        padding: 10px 24px !important;
        border-radius: 50px !important;
        transition: all 0.3s ease !important;
    }

    .btn-ocean:hover {
        transform: translateY(-2px) !important;
        box-shadow: 0 4px 12px rgba(225, 29, 72, 0.4) !important;
        color: #ffffff !important;
    }

    /* Custom Navigation Links */
    .nav-link-custom {
        color: #0A1628 !important;
        position: relative;
        transition: color 0.3s ease;
        font-size: 0.95rem;
        letter-spacing: 0.3px;
    }


    .nav-link-custom:hover {
        color: #E11D48 !important;
    }

    .nav-link-custom::after {
        content: '';
        position: absolute;
        width: 0;
        height: 3px;
        bottom: -5px;
        left: 15%;
        background-color: #E11D48;
        transition: width 0.3s ease;
        border-radius: 2px;
    }

    .nav-link-custom:hover::after,
    .nav-link-custom.active::after {
        width: 70%;
    }

    .nav-link-custom.active {
        color: #E11D48 !important;
    }

    /* Absolute Centering for Desktop (Compact) */
    @media (min-width: 992px) {
        .navbar-nav-centered {
            position: absolute;
            left: 42%;
            top: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: row;
            margin: 0 !important;
            padding: 0 !important;
            width: auto;
            z-index: 1000;
        }
    }

    .navbar-logo {
        height: 55px;
        width: 55px;
        border-radius: 50%;
        object-fit: cover;
        border: 2px solid #E11D48;
    }

    .nav-brand-text {
        letter-spacing: 0.5px;
        font-size: 22px;
        color: #0A1628;
    }

    @media (max-width: 991.98px) {
        .navbar-logo {
            height: 45px;
            width: 45px;
        }

        .nav-brand-text {
            font-size: 18px;
        }

        .navbar-nav-centered {
            margin: 20px 0 !important;
        }

        .navbar-collapse .d-flex {
            flex-direction: column;
            width: 100%;
            gap: 10px !important;
        }

        .navbar-collapse .btn {
            width: 100%;
        }

        .city-selector-en {
            justify-content: center;
            width: 100%;
            background: #f8f9fa;
        }
    }
</style>



<script>
    document.addEventListener('DOMContentLoaded', function () {
        // Function to set active link based on hash or current path
        function setActiveLink() {
            const currentHash = window.location.hash;
            const currentPath = window.location.pathname;
            const navLinks = document.querySelectorAll('.nav-link-custom');

            // First, remove active class from all
            navLinks.forEach(link => link.classList.remove('active'));

            let matched = false;

            // Check for hash matches first (Services, Contact)
            if (currentHash) {
                navLinks.forEach(link => {
                    if (link.getAttribute('href').includes(currentHash)) {
                        link.classList.add('active');
                        matched = true;
                    }
                });
            }

            // If no hash match, fallback to path match (Django active logic helps, but this enforces JS side)
            if (!matched) {
                navLinks.forEach(link => {
                    const href = link.getAttribute('href');
                    // simple check: if href matches path and isn't a hash link
                    if (href === currentPath || (href === '/' && currentPath === '/')) {
                        link.classList.add('active');
                    }
                });
            }
        }

        // Run on load
        setActiveLink();

        // Run on hash change
        window.addEventListener('hashchange', setActiveLink);

        // Add click listeners to upadte immediately without waiting for hashchange (smoother)
        const navLinks = document.querySelectorAll('.nav-link-custom');
        navLinks.forEach(link => {
            link.addEventListener('click', function () {
                // If it's a hash link, manually set active
                if (this.getAttribute('href').includes('#')) {
                    navLinks.forEach(l => l.classList.remove('active'));
                    this.classList.add('active');
                }
            });
        });
    });
</script>
